    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Page colour = app background (iOS samples it for the status bar area and overscroll).
         The app updates --app-bg when the theme changes (light/dark/manual choice). */
      :root {
        --app-bg: #f4f5f8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --app-bg: #0a0c11;
        }
      }
      html,
      body {
        background-color: var(--app-bg);
      }
      #status-bar-band {
        display: none;
      }
      /* iPhone home-screen app (iOS 26+): */
      @supports (-webkit-touch-callout: none) {
        @media (display-mode: standalone) {
          /* At launch WebKit reports a viewport one status bar shorter than the screen
             (100%, 100dvh and innerHeight all wrong), so the app is sized explicitly. */
          html,
          body,
          #root {
            height: min(100lvh, calc(100dvh + env(safe-area-inset-top)));
          }
          /* iOS 27 blurs whatever is under the status bar unless a fixed, opaque element
             (≥ 90% wide, > 10px tall) sits at the top to take the colour from; iOS then paints
             the whole status bar area with it. 12px is enough and stays inside the status bar
             on every iPhone (the smallest is 20px), so it never covers the app. Must stay
             hit-testable (no pointer-events: none). */
          #status-bar-band {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
            background-color: var(--app-bg);
            z-index: 1;
          }
        }
      }
    </style>
